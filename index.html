
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Absensi SDIT Persis 99</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      margin: 0;
      padding: 20px 14px;
      text-align: center;
    }
    .panel {
      max-width: 480px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    button {
      padding: 14px 20px;
      border: 0;
      border-radius: 9px;
      background: #176044;
      color: white;
      font-size: 16px;
      margin: 8px 4px;
    }
    #reader {
      width: 100%;
      margin: 18px auto;
    }
    #hasil {
      padding: 15px;
      border-radius: 10px;
      background: #eef5f0;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
    .nisn {
      font-size: 24px;
      font-weight: bold;
      color: #176044;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>SCANNER ABSENSI</h2>
    <p>SDIT Persis 99 Rancabango</p>
    <p id="infoKelas">Memeriksa tiket scanner...</p>

    <button id="btnMulai" onclick="mulaiScan()" disabled>
      MULAI SCAN BARCODE
    </button>

    <button onclick="stopScan()">HENTIKAN</button>

    <div id="reader"></div>
    <div id="hasil">Memeriksa akses...</div>
  </div>

  <script>
    // URL WEB APP GOOGLE APPS SCRIPT
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyYTWOGKfz9uGWZYPrp2hV1KW2opeWxmEsjSsK-7X6Z3eOibd3-vHjvVi9PlCBhnkr8bw/exec";

    const ticket =
      new URLSearchParams(window.location.search).get("ticket");

    let scanner = null;
    let sedangScan = false;
    let sudahTerbaca = false;
    let sedangMengirim = false;

    const hasil = document.getElementById("hasil");
    const tombolMulai = document.getElementById("btnMulai");

    if (!ticket) {
      hasil.textContent =
        "Akses ditolak. Silakan buka scanner dari dashboard absensi.";
    } else {
      document.getElementById("infoKelas").textContent =
        "Tiket tersedia. Silakan mulai scan.";

      hasil.textContent = "Scanner siap digunakan.";
      tombolMulai.disabled = false;
    }

    async function mulaiScan() {
      if (!ticket || sedangScan) return;

      try {
        hasil.textContent = "Mengakses kamera...";

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras.length) {
          throw new Error("Kamera tidak ditemukan.");
        }

        const kameraBelakang =
          cameras.find(c =>
            /back|rear|environment|belakang/i.test(c.label)
          ) || cameras[cameras.length - 1];

        scanner = new Html5Qrcode("reader");
        sudahTerbaca = false;

        await scanner.start(
          kameraBelakang.id,
          {
            fps: 10,
            qrbox: { width: 280, height: 150 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.QR_CODE
            ]
          },
          hasilScan,
          function () {}
        );

        sedangScan = true;
        tombolMulai.disabled = true;
        hasil.textContent = "Kamera aktif. Arahkan ke barcode NISN.";

      } catch (error) {
        hasil.textContent =
          "Gagal membuka kamera: " + error.message;
      }
    }

    async function hasilScan(teks) {
      if (sudahTerbaca || sedangMengirim) return;

      sudahTerbaca = true;
      sedangMengirim = true;

      const nisn = String(teks).trim();

      await stopScan();

      hasil.innerHTML =
        "<strong>Barcode terbaca</strong>" +
        "<div class='nisn'></div>" +
        "<div>Mengirim absensi ke server...</div>";

      hasil.querySelector(".nisn").textContent = nisn;

      kirimAbsensi(nisn);
    }

    function kirimAbsensi(nisn) {
      const callbackName = "absensiCallback";

      window[callbackName] = function(data) {
        delete window[callbackName];

        if (data && data.success) {
          hasil.innerHTML =
            "<strong>ABSENSI BERHASIL</strong>" +
            "<div class='nisn'></div>" +
            "<div></div>";

          hasil.querySelector(".nisn").textContent = nisn;
          hasil.querySelectorAll("div")[1].textContent =
            data.message || "Data absensi berhasil disimpan.";

        } else {
          hasil.innerHTML =
            "<strong>ABSENSI GAGAL</strong><div></div>";

          hasil.querySelector("div").textContent =
            data && data.message
              ? data.message
              : "Terjadi kesalahan saat menyimpan absensi.";
        }
      };

      const script = document.createElement("script");

      script.src =
        API_URL +
        "?action=scan" +
        "&ticket=" + encodeURIComponent(ticket) +
        "&nisn=" + encodeURIComponent(nisn) +
        "&callback=" + callbackName;

      script.onerror = function() {
        delete window[callbackName];
        hasil.textContent =
          "Tidak dapat menghubungi server Apps Script.";
      };

      document.body.appendChild(script);
    }

    async function stopScan() {
      if (scanner && sedangScan) {
        try {
          await scanner.stop();
          await scanner.clear();
        } catch (error) {
          console.log(error);
        }
      }

      sedangScan = false;
      tombolMulai.disabled = !ticket || sedangMengirim;
    }
  </script>
</body>
</html>
